[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ispatched"
dynamic = ["version"]
description = "CVE patch checker: is this host patched against that CVE? Starts with PHP2Shell."
readme = "README.md"
requires-python = ">=3.6"
license = {text = "Apache-2.0"}
authors = [{name = "Daniel Ignacio Fernández", email = "2724194+dannetstudio@users.noreply.github.com"}]
keywords = ["cve", "security", "php", "patch-management", "sysadmin", "php2shell"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]

[project.scripts]
ispatched = "ispatched.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ispatched.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ispatched = ["advisories/*.json"]
